# gcovr configuration for phosphor-host-postd

filter = lpcsnoop/
filter = queued-boot-progress/
filter = sbmrbootprogress/

# Exclude test directory
exclude = .*/test/.*

# Exclude subprojects (wrap dependencies)
exclude = .*/subprojects/.*

# Exclude test and mock files anywhere
exclude = .*/test_.*
exclude = .*/.*_test\.cpp
exclude = .*/mock_.*

# Exclude app entry points not run by unit tests (100% = testable library/daemon code)
exclude = .*main\.cpp
exclude = .*BootProgressMain\.cpp

# Exclude hardware-dependent polling device impls (require real I2C/USB)
exclude = .*I2CPollingDevice\.hpp
exclude = .*I2CPollingDevice\.cpp
exclude = .*USBPollingDevice\.hpp
exclude = .*USBPollingDevice\.cpp

exclude-throw-branches = yes

# Exclude branches in lines that are not reachable (compiler dead code).
exclude-unreachable-branches = yes

decisions = yes

html = yes
print-summary = yes
